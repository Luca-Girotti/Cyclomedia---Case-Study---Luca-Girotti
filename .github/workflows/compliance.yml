name: compliance

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Reference app meets the bar
        run: python checker/check.py reference_app
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # optional: without it, the AI judge is skipped

      - name: Checker still catches the planted problems in the leaky app
        run: |
          set +e
          python checker/check.py examples/leaky_app --no-ai
          test $? -eq 1
